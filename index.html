<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e1e1e">
    <title>A.S Code Pro - IDE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #1e1e1e;
            --sidebar: #252526;
            --activity-bar: #333333;
            --accent: #007acc;
            --accent-hover: #005f9e;
            --text: #cccccc;
            --border: #3c3c3c;
            --console-bg: #111;
            
            /* Notification Colors */
            --notify-success: #89d185;
            --notify-error: #f48771;
            --notify-warning: #cca700;
            --notify-info: #4fc1ff;

            --toolbar-height: 46px;
            --status-height: 24px;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body, html {
            background-color: var(--bg); color: var(--text);
            height: 100dvh; width: 100%; margin: 0; padding: 0;
            display: flex; flex-direction: column;
            font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; 
        }

        /* --- HEADER & TOOLBAR --- */
        header {
            height: var(--toolbar-height); background: var(--sidebar); display: flex;
            align-items: center; justify-content: space-between; padding: 0 10px;
            border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 20;
        }
        .brand-section { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .toolbar-group {
            display: flex; gap: 5px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; flex-grow: 1; justify-content: flex-end;
        }
        .toolbar-group::-webkit-scrollbar { display: none; }

        .btn {
            background: #333; color: #eee; border: 1px solid #444;
            height: 30px; padding: 0 10px; font-size: 13px; cursor: pointer;
            border-radius: 4px; display: flex; align-items: center; justify-content: center;
            gap: 4px; transition: background 0.2s, transform 0.1s; white-space: nowrap;
        }
        .btn:active { transform: scale(0.95); }
        .btn:hover { background: #444; }
        .btn-primary { background-color: var(--accent); border-color: #005f9e; color: white; font-weight: bold; }
        .btn-primary:hover { background-color: var(--accent-hover); }
        .btn-success { background-color: #2e7d32; border-color: #1b5e20; color: white; }
        .btn-info { background-color: #2b5b84; border-color: #1f4261; color: white; }
        .btn-icon { width: 34px; padding: 0; font-size: 15px; flex-shrink: 0; }

        /* --- SEARCH BAR --- */
        #searchBar {
            display: none; background: #2d2d2d; padding: 8px;
            border-bottom: 1px solid var(--border); justify-content: center; gap: 5px;
            flex-shrink: 0; z-index: 15;
        }
        #searchInput { background: #1e1e1e; border: 1px solid #444; color: white; padding: 5px; border-radius: 3px; width: 50%; }

        /* --- APP LAYOUT --- */
        .app-container {
            display: flex; flex-grow: 1; height: calc(100% - var(--toolbar-height) - var(--status-height));
            overflow: hidden;
        }

        /* --- SIDEBAR EXPLORER --- */
        .sidebar {
            width: 220px; background: var(--sidebar); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; transition: width 0.3s ease; flex-shrink: 0;
        }
        .sidebar.collapsed { width: 0; border: none; overflow: hidden; }
        .sidebar-header {
            padding: 10px; font-size: 11px; font-weight: bold; text-transform: uppercase;
            color: #888; display: flex; justify-content: space-between; align-items: center;
        }
        .file-list { flex-grow: 1; overflow-y: auto; padding: 0 5px; }
        
        .file-item {
            padding: 4px 10px; cursor: pointer; border-radius: 4px; font-size: 13px;
            display: flex; align-items: center; justify-content: space-between; color: #ccc;
            height: 32px;
        }
        .file-item:hover { background: rgba(255,255,255,0.05); }
        .file-item.active { background: rgba(0, 122, 204, 0.2); color: #fff; }
        
        .file-name { display: flex; align-items: center; gap: 8px; flex-grow: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        
        .file-del-btn {
            background: transparent; border: none; color: #888; font-size: 16px;
            cursor: pointer; padding: 0 6px; border-radius: 4px; display: none; line-height: 1;
        }
        .file-item:hover .file-del-btn { display: block; } 
        .file-del-btn:hover { background: rgba(244, 135, 113, 0.2); color: var(--notify-error); }

        /* --- EDITOR AREA --- */
        .editor-wrapper {
            flex-grow: 1; display: flex; flex-direction: column; position: relative;
            background: var(--bg); min-width: 0;
        }
        .tabs-bar {
            height: 35px; background: #2d2d2d; display: flex; align-items: center;
            overflow-x: auto; border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        .tab {
            padding: 0 15px; height: 100%; display: flex; align-items: center;
            background: var(--sidebar); color: #888; cursor: pointer; border-right: 1px solid var(--border);
            font-size: 13px; min-width: 120px; border-top: 2px solid transparent;
        }
        .tab.active { background: var(--bg); color: #fff; border-top-color: var(--accent); }

        .code-container { display: flex; flex-grow: 1; position: relative; overflow: hidden; }
        .gutter {
            width: 45px; background: var(--bg); color: #6e7681; text-align: right;
            padding: 10px 8px; font-family: 'Fira Code', monospace; font-size: 13px;
            line-height: 1.5; border-right: 1px solid var(--border); user-select: none;
            overflow: hidden; flex-shrink: 0; z-index: 2;
        }

        .editor-core { position: relative; flex-grow: 1; height: 100%; overflow: hidden; }
        #highlighting {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            margin: 0; padding: 10px; font-family: 'Fira Code', monospace;
            font-size: 13px; line-height: 1.5; white-space: pre; color: #d4d4d4;
            overflow: hidden; z-index: 1; pointer-events: none;
        }
        #editor {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: transparent; color: transparent; caret-color: #fff;
            border: none; padding: 10px; font-family: 'Fira Code', monospace;
            font-size: 13px; line-height: 1.5; resize: none; white-space: pre;
            overflow: auto; z-index: 2; outline: none;
        }
        .syn-keyword { color: #569cd6; }
        .syn-string { color: #ce9178; }
        .syn-tag { color: #569cd6; }
        .syn-comment { color: #6a9955; font-style: italic; }

        /* --- HELPER BAR --- */
        .helper-bar {
            background: var(--sidebar); padding: 8px 5px; display: flex; gap: 6px;
            overflow-x: auto; border-top: 1px solid var(--border); flex-shrink: 0; z-index: 20;
        }
        .helper-btn {
            background: #3e3e42; color: #fff; border: none; min-width: 40px; height: 34px;
            border-radius: 4px; font-family: 'Fira Code', monospace; font-size: 14px;
            cursor: pointer; flex-shrink: 0; transition: background 0.2s;
        }
        .helper-btn:active { background: var(--accent); }

        /* --- PREVIEW PANEL --- */
        .preview-panel {
            width: 45%; background: #fff; border-left: 2px solid var(--border);
            display: none; flex-direction: column; position: relative;
        }
        .preview-panel.active { display: flex; }
        .preview-header {
            background: var(--sidebar); padding: 5px 10px; color: #aaa; font-size: 11px;
            border-bottom: 1px solid var(--border); display: flex; justify-content: space-between;
        }
        #liveFrame { flex-grow: 1; border: none; width: 100%; background: #fff; }

        /* --- STATUS BAR --- */
        .status-bar {
            height: var(--status-height); background: var(--accent); color: white;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 10px; font-size: 11px; flex-shrink: 0;
        }

        /* --- MODALS & OVERLAYS --- */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 5900; }
        .modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #252526; border: 1px solid #454545; box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            width: 90%; max-width: 400px; z-index: 6000; border-radius: 8px; padding: 20px;
        }

        .snippet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .snippet-btn { background: #333; color: #ccc; border: 1px solid #444; padding: 10px; border-radius: 4px; cursor: pointer; text-align: left; transition: background 0.2s; }
        .snippet-btn:hover { background: #444; }

        /* --- NOTIFICATION SYSTEM --- */
        #notificationContainer {
            position: fixed;
            top: 20px; right: 20px;
            display: flex; flex-direction: column; gap: 10px;
            z-index: 999999; pointer-events: none;
        }

        .app-notification {
            background: rgba(30, 30, 32, 0.7);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff; padding: 12px 16px; border-radius: 8px; font-size: 13px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: space-between; gap: 15px;
            pointer-events: auto;
            min-width: 280px; max-width: 380px;
            animation: slideInRight 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .app-notification.fade-out { animation: fadeOutRight 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .notify-msg { flex-grow: 1; line-height: 1.4; }
        .notify-close {
            background: transparent; border: none; color: #999; font-size: 20px;
            cursor: pointer; padding: 0 4px; display: flex; align-items: center; justify-content: center;
            transition: color 0.2s;
        }
        .notify-close:hover { color: #fff; }

        /* --- FULLSCREEN PREVIEW OVERLAY --- */
        .fs-preview-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #1e1e1e; z-index: 90000;
        }
        .fs-preview-header {
            height: 40px; background: var(--sidebar); display: flex;
            justify-content: space-between; align-items: center; padding: 0 15px;
            border-bottom: 1px solid var(--border);
        }

        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; height: 25%; border-right: none; border-bottom: 1px solid var(--border); }
            .sidebar.collapsed { height: 0; }
            .preview-panel { width: 100%; height: 40%; border-left: none; border-top: 2px solid var(--border); }
            .brand-section { width: auto; }
            
            /* Show delete icon permanently on mobile since there is no hover */
            .file-del-btn { display: block; }
            
            /* Responsive Notifications */
            #notificationContainer {
                top: auto; bottom: 20px; left: 50%; transform: translateX(-50%); right: auto;
                flex-direction: column-reverse;
                width: 90%; max-width: 400px;
            }
            .app-notification { width: 100%; min-width: unset; max-width: unset; animation: slideInBottom 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
            .app-notification.fade-out { animation: fadeOutBottom 0.3s forwards; }
        }

        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(120%); opacity: 0; } }
        @keyframes slideInBottom { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOutBottom { from { transform: translateY(0); opacity: 1; } to { transform: translateY(120%); opacity: 0; } }
    </style>
</head>
<body>

    <header>
        <div class="brand-section">
            <button class="btn btn-icon" onclick="toggleSidebar()" title="Toggle Explorer" style="background:transparent; border:none;">📁</button>
            <span style="font-weight:700; color:#fff; font-size:14px; letter-spacing:0.5px;">A.S Code <span style="font-size:10px; color:var(--accent); vertical-align:super;">PRO</span></span>
        </div>
        
        <div class="toolbar-group">
            <button class="btn btn-info" onclick="showNotification('Documentation is loaded inline.', 'info')" title="Open Documentation Manual">📘 GUIDE</button>
            <button class="btn btn-icon" onclick="window.open('https://aryansharma1171.github.io/a.s-code-editor/index.html', '_blank')" title="Open Mobile Version">📱</button>
            <button class="btn btn-icon" onclick="openContact()" title="Contact Us">📧</button>
            <button class="btn btn-icon" onclick="openSnippets()" title="Snippets">⚡</button>
            <button class="btn btn-icon" onclick="document.execCommand('undo')" title="Undo">↩️</button>
            <button class="btn btn-icon" onclick="toggleSearch()" title="Search">🔍</button>
            <button class="btn btn-icon" onclick="document.getElementById('colorPickerInput').click()" title="Color Picker">🎨</button>
            <button class="btn btn-icon" onclick="location.reload()" title="Refresh Page">🔄</button>
            
            <button class="btn btn-primary" onclick="openFullscreenPreview()" title="Watch Result in Fullscreen">📺 FULL SCREEN</button>
            <button class="btn btn-success" id="splitToggleBtn" onclick="togglePreview()">⚡ LIVE SPLIT</button>
            
            <button class="btn btn-icon" onclick="saveFile()" title="Save">💾</button>
            <button class="btn btn-icon" onclick="document.getElementById('fileInput').click()" title="Open">📂</button>
        </div>
    </header>

    <div id="searchBar">
        <input type="text" id="searchInput" placeholder="Find text in active file...">
        <button class="btn" onclick="findText()">Find</button>
        <button class="btn" onclick="toggleSearch()">✖</button>
    </div>

    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span>Explorer</span>
                <button class="btn" style="padding:2px 6px; height:24px;" onclick="createNewFile()">+</button>
            </div>
            <div class="file-list" id="fileList"></div>
        </div>

        <div class="editor-wrapper">
            <div class="tabs-bar">
                <div class="tab active" id="currentTab">index.html</div>
            </div>
            <div class="code-container">
                <div class="gutter" id="gutter">1</div>
                <div class="editor-core">
                    <pre><code id="highlighting"></code></pre>
                    <textarea id="editor" spellcheck="false"></textarea>
                </div>
            </div>
            <div class="helper-bar">
                <button class="helper-btn" onclick="insertText('<')">&lt;</button>
                <button class="helper-btn" onclick="insertText('>')">&gt;</button>
                <button class="helper-btn" onclick="insertText('/')">/</button>
                <button class="helper-btn" onclick="insertText('=')">=</button>
                <button class="helper-btn" onclick="insertText('\"')">"</button>
                <button class="helper-btn" onclick="insertText(';')">;</button>
                <button class="helper-btn" onclick="insertText('{')">{</button>
                <button class="helper-btn" onclick="insertText('}')">}</button>
                <button class="helper-btn" onclick="insertText('class=')">cls</button>
                <button class="helper-btn" onclick="insertText('id=')">id</button>
                <button class="helper-btn" onclick="insertText('!')">!</button>
                <button class="helper-btn" onclick="insertText('px')">px</button>
            </div>
        </div>

        <div class="preview-panel" id="previewPanel">
            <div class="preview-header">
                <span>🔴 Live Sync Active</span>
                <span style="width:8px; height:8px; border-radius:50%; background:#4caf50;"></span>
            </div>
            <iframe id="liveFrame" sandbox="allow-scripts allow-modals"></iframe>
        </div>
    </div>

    <div class="status-bar">
        <div>Ln <span id="statusLn">1</span>, Col <span id="statusCol">1</span> | <span id="statusLen">0</span> Chars</div>
        <div>UTF-8 | A.S Code Pro Engine</div>
    </div>

    <div id="fullscreenPreviewOverlay" class="fs-preview-overlay">
        <div class="fs-preview-header">
            <span style="font-weight:600; color:#fff; font-size: 14px;">A.S Code Pro - Fullscreen Output</span>
            <button class="notify-close" onclick="closeFullscreenPreview()">&times;</button>
        </div>
        <iframe id="fsLiveFrame" sandbox="allow-scripts allow-modals" style="width:100%; height:calc(100% - 40px); border:none; background:#fff;"></iframe>
    </div>

    <div id="notificationContainer"></div>
    <div class="overlay" id="overlay" onclick="closeAllModals()"></div>

    <div class="modal" id="customPromptModal">
        <h3 id="promptTitle" style="color:white; margin:0 0 15px 0; font-size:15px; font-weight:600;">Title</h3>
        <input type="text" id="promptInput" style="width:100%; background:rgba(0,0,0,0.5); border:1px solid #444; color:#fff; padding:12px; border-radius:6px; margin-bottom:20px; font-family:'Fira Code', monospace;" autocomplete="off">
        <div style="display:flex; gap:10px;">
            <button class="snippet-btn" style="flex:1; text-align:center;" onclick="closePrompt()">Cancel</button>
            <button class="snippet-btn" style="flex:1; text-align:center; background:var(--accent); border-color:var(--accent); color:white; font-weight:bold;" onclick="submitPrompt()">Confirm</button>
        </div>
    </div>
    
    <div class="modal" id="customConfirmModal">
        <h3 id="confirmTitle" style="color:white; margin:0 0 10px 0; font-size:15px; font-weight:600;">Confirm Action</h3>
        <p id="confirmMessage" style="color:#ccc; font-size:13px; margin-bottom:20px; line-height:1.5;">Are you sure?</p>
        <div style="display:flex; gap:10px;">
            <button class="snippet-btn" style="flex:1; text-align:center;" onclick="closeConfirm()">Cancel</button>
            <button class="snippet-btn" style="flex:1; text-align:center; background:var(--notify-error); border-color:var(--notify-error); color:white; font-weight:bold;" onclick="submitConfirm()">Delete</button>
        </div>
    </div>

    <div class="modal" id="templateModal">
        <h3 style="color:white; margin:0 0 15px 0; font-size:15px;">Insert Template</h3>
        <div class="snippet-grid">
            <button class="snippet-btn" onclick="insertSnippet('html')">🌐 HTML5 Base</button>
            <button class="snippet-btn" onclick="insertSnippet('css')">🎨 CSS Reset</button>
            <button class="snippet-btn" onclick="insertSnippet('nav')">🗺️ Navbar</button>
            <button class="snippet-btn" onclick="insertSnippet('card')">🃏 Card UI</button>
            <button class="snippet-btn" onclick="insertSnippet('btn')">🔘 Button</button>
            <button class="snippet-btn" onclick="insertSnippet('js')">⚙️ JS Script</button>
        </div>
        <button onclick="closeAllModals()" style="margin-top:10px; width:100%; padding:10px; cursor:pointer; background:#444; color:white; border:none; border-radius:4px;">Cancel</button>
    </div>

    <div class="modal" id="contactModal">
        <h3 style="color:white; margin:0 0 15px 0; font-size:15px;">📧 Contact Support</h3>
        <div style="background:#1e1e1e; padding:12px; border:1px solid #444; border-radius:4px; margin-bottom:15px; color:#fff; text-align:center; font-family:'Fira Code', monospace;">
            etho98g@gmail.com
        </div>
        <div style="display:flex; gap:10px;">
            <button class="snippet-btn" style="flex:1; text-align:center; background:var(--accent); border-color:var(--accent); color:white; font-weight:bold;" onclick="copyEmail(this)">Copy</button>
            <button class="snippet-btn" style="flex:1; text-align:center;" onclick="closeAllModals()">Close</button>
        </div>
    </div>

    <input type="file" id="fileInput" accept=".html,.txt,.js,.css" onchange="loadFile(event)" style="display:none;">
    <input type="color" id="colorPickerInput" onchange="insertColor(this)" style="visibility:hidden; width:0; height:0; position:absolute;">

    <script>
        /* --- MODERN NOTIFICATION SYSTEM --- */
        const notificationColors = {
            success: 'var(--notify-success)',
            error: 'var(--notify-error)',
            warning: 'var(--notify-warning)',
            info: 'var(--notify-info)'
        };

        function showNotification(message, type = 'info') {
            const container = document.getElementById('notificationContainer');
            const notif = document.createElement('div');
            notif.className = 'app-notification';
            
            const borderColor = notificationColors[type] || notificationColors.info;
            notif.style.borderLeft = `4px solid ${borderColor}`;

            notif.innerHTML = `
                <div class="notify-msg">${message}</div>
                <button class="notify-close" onclick="this.parentElement.classList.add('fade-out'); setTimeout(() => this.parentElement.remove(), 300);">&times;</button>
            `;
            
            container.appendChild(notif);

            setTimeout(() => {
                if(container.contains(notif)) {
                    notif.classList.add('fade-out');
                    setTimeout(() => { if(container.contains(notif)) notif.remove(); }, 300);
                }
            }, 4000);
        }

        /* --- CUSTOM PROMPT MODAL (FOR TEXT INPUT) --- */
        let currentPromptCallback = null;

        function showCustomPrompt(message, callback) {
            document.getElementById("overlay").style.display = "block";
            const modal = document.getElementById("customPromptModal");
            modal.style.display = "block";
            document.getElementById("promptTitle").innerText = message;
            
            const input = document.getElementById("promptInput");
            input.value = "";
            input.focus();
            
            currentPromptCallback = callback;
        }

        function closePrompt() {
            document.getElementById("customPromptModal").style.display = "none";
            document.getElementById("overlay").style.display = "none";
            currentPromptCallback = null;
        }

        function submitPrompt() {
            if (currentPromptCallback) {
                const val = document.getElementById("promptInput").value.trim();
                currentPromptCallback(val);
            }
            closePrompt();
        }

        document.getElementById('promptInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') submitPrompt();
            if (e.key === 'Escape') closePrompt();
        });

        /* --- CUSTOM CONFIRM MODAL (FOR DELETION) --- */
        let currentConfirmCallback = null;

        function showConfirmModal(title, message, callback) {
            document.getElementById("overlay").style.display = "block";
            const modal = document.getElementById("customConfirmModal");
            modal.style.display = "block";
            document.getElementById("confirmTitle").innerText = title;
            document.getElementById("confirmMessage").innerText = message;
            
            currentConfirmCallback = callback;
        }

        function closeConfirm() {
            document.getElementById("customConfirmModal").style.display = "none";
            document.getElementById("overlay").style.display = "none";
            currentConfirmCallback = null;
        }

        function submitConfirm() {
            if (currentConfirmCallback) currentConfirmCallback();
            closeConfirm();
        }

        /* --- VIRTUAL FILE SYSTEM --- */
        let vfs = JSON.parse(localStorage.getItem('as-code-vfs')) || {
            'index.html': '\n<h1>Hello World</h1>',
            'style.css': 'body {\n    background: #000;\n    color: #fff;\n}',
            'script.js': 'console.log("System Initialized");'
        };
        let currentFile = 'index.html';

        function saveVFS() { localStorage.setItem('as-code-vfs', JSON.stringify(vfs)); }

        function renderExplorer() {
            const list = document.getElementById('fileList');
            list.innerHTML = '';
            for (const filename in vfs) {
                const div = document.createElement('div');
                div.className = `file-item ${filename === currentFile ? 'active' : ''}`;
                
                const nameSpan = document.createElement('span');
                nameSpan.className = 'file-name';
                nameSpan.innerHTML = `📄 ${filename}`;
                nameSpan.onclick = () => switchFile(filename);
                
                const delBtn = document.createElement('button');
                delBtn.className = 'file-del-btn';
                delBtn.innerHTML = '&times;';
                delBtn.title = 'Delete File';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteFile(filename);
                };
                
                div.appendChild(nameSpan);
                div.appendChild(delBtn);
                list.appendChild(div);
            }
        }

        function createNewFile() {
            showCustomPrompt("Enter file name (e.g., script.js):", (name) => {
                if (name) {
                    if (vfs[name] !== undefined) {
                        showNotification("File already exists!", "warning");
                    } else {
                        vfs[name] = '';
                        saveVFS();
                        switchFile(name);
                        showNotification(`Created file: ${name}`, "success");
                    }
                }
            });
        }
        
        function deleteFile(filename) {
            showConfirmModal("Delete File", `Are you sure you want to permanently delete '${filename}'?`, () => {
                delete vfs[filename];
                const remainingFiles = Object.keys(vfs);
                
                if (remainingFiles.length === 0) {
                    vfs['index.html'] = '';
                    currentFile = 'index.html';
                } else if (currentFile === filename) {
                    currentFile = remainingFiles[0];
                }
                
                saveVFS();
                switchFile(currentFile);
                showNotification(`${filename} deleted`, "success");
            });
        }

        function switchFile(filename) {
            currentFile = filename;
            editor.value = vfs[filename];
            document.getElementById('currentTab').innerText = filename;
            renderExplorer();
            updateEditor();
        }

        /* --- EDITOR ENGINE --- */
        const editor = document.getElementById('editor');
        const highlighting = document.getElementById('highlighting');
        const gutter = document.getElementById('gutter');
        let debounceTimer;

        window.addEventListener('load', () => {
            initApp();
            showNotification("A.S Code Pro Initialized", "success");
        });

        function initApp() {
            if (Object.keys(vfs).length === 0) {
                vfs['index.html'] = '';
                saveVFS();
            }
            const startFile = vfs['index.html'] !== undefined ? 'index.html' : Object.keys(vfs)[0];
            switchFile(startFile);
        }

        function updateEditor() {
            const text = editor.value;
            vfs[currentFile] = text;
            saveVFS();

            highlighting.innerHTML = applySyntaxHighlighting(escapeHTML(text));
            
            const lines = text.split('\n').length;
            gutter.innerHTML = Array(lines).fill(0).map((_, i) => i + 1).join('<br>');
            
            document.getElementById('statusLen').innerText = text.length;
            updateCursorPos();

            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                if (previewActive) updatePreview();
                if (document.getElementById('fullscreenPreviewOverlay').style.display === 'block') {
                    updateFullscreenPreview();
                }
            }, 500);
        }

        function escapeHTML(text) { return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

        function applySyntaxHighlighting(text) {
            return text
                .replace(/&lt;([a-zA-Z0-9]+)(.*?)&gt;/g, '<span class="syn-tag">&lt;$1$2&gt;</span>') 
                .replace(/(["'])(.*?)\1/g, '<span class="syn-string">$1$2$1</span>')
                .replace(/\b(function|return|let|const|var|if|else|for|while)\b/g, '<span class="syn-keyword">$1</span>')
                .replace(/(\/\/.*|\/\*[\s\S]*?\*\/|&lt;!--[\s\S]*?--&gt;)/g, '<span class="syn-comment">$1</span>');
        }

        editor.addEventListener('scroll', () => {
            highlighting.scrollTop = editor.scrollTop;
            highlighting.scrollLeft = editor.scrollLeft;
            gutter.scrollTop = editor.scrollTop;
        });

        editor.addEventListener('input', updateEditor);
        editor.addEventListener('keyup', updateCursorPos);
        editor.addEventListener('click', updateCursorPos);

        function updateCursorPos() {
            const textLines = editor.value.substr(0, editor.selectionStart).split("\n");
            document.getElementById('statusLn').innerText = textLines.length;
            document.getElementById('statusCol').innerText = textLines[textLines.length - 1].length + 1;
        }

        /* --- PREVIEW ENGINES (Fixed with srcdoc) --- */
        let previewActive = false;
        function togglePreview() {
            previewActive = !previewActive;
            const btn = document.getElementById('splitToggleBtn');
            const panel = document.getElementById('previewPanel');
            
            if (previewActive) {
                btn.innerText = '✖ CLOSE SPLIT';
                btn.classList.add('active');
                panel.classList.add('active');
                updatePreview();
                showNotification("Live server started", "success");
            } else {
                btn.innerText = '⚡ LIVE SPLIT';
                btn.classList.remove('active');
                panel.classList.remove('active');
                showNotification("Live server disconnected", "info");
            }
        }

        function getMergedSource() {
            const html = vfs['index.html'] || '';
            const css = `<style>\n${vfs['style.css'] || ''}\n</style>`;
            const js = `<script>\n${vfs['script.js'] || ''}\n<\/script>`;
            return html + css + js;
        }

        function updatePreview() {
            if (!previewActive) return;
            document.getElementById('liveFrame').srcdoc = getMergedSource();
        }

        function openFullscreenPreview() {
            const fsOverlay = document.getElementById('fullscreenPreviewOverlay');
            fsOverlay.style.display = 'block';
            updateFullscreenPreview();
            showNotification("Fullscreen preview launched", "success");
        }

        function closeFullscreenPreview() {
            const fsOverlay = document.getElementById('fullscreenPreviewOverlay');
            fsOverlay.style.display = 'none';
        }

        function updateFullscreenPreview() {
            document.getElementById('fsLiveFrame').srcdoc = getMergedSource();
        }

        /* --- UI UTILITIES --- */
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }
        
        // Modals
        function openSnippets() { document.getElementById("overlay").style.display = "block"; document.getElementById("templateModal").style.display = "block"; }
        function openContact() { document.getElementById("overlay").style.display = "block"; document.getElementById("contactModal").style.display = "block"; }
        function closeAllModals() { 
            document.getElementById("overlay").style.display = "none"; 
            document.getElementById("templateModal").style.display = "none"; 
            document.getElementById("contactModal").style.display = "none";
            
            document.getElementById("customPromptModal").style.display = "none";
            currentPromptCallback = null;
            
            document.getElementById("customConfirmModal").style.display = "none";
            currentConfirmCallback = null;
        }
        
        function copyEmail(btn) {
            navigator.clipboard.writeText("etho98g@gmail.com");
            const originalText = btn.innerText;
            btn.innerText = "✓ Copied!"; btn.style.background = "#28a745";
            setTimeout(() => { btn.innerText = originalText; btn.style.background = "var(--accent)"; }, 2000);
            showNotification("Support email copied to clipboard", "success");
        }

        // Search
        function toggleSearch() {
            const bar = document.getElementById("searchBar");
            bar.style.display = bar.style.display === "flex" ? "none" : "flex";
            if(bar.style.display === "flex") document.getElementById("searchInput").focus();
        }
        function findText() {
            const query = document.getElementById("searchInput").value;
            if (!query) return;
            const index = editor.value.indexOf(query, editor.selectionEnd);
            if (index !== -1) { 
                editor.focus(); 
                editor.setSelectionRange(index, index + query.length); 
            } else { 
                showNotification(`"${query}" not found in current file`, "warning"); 
            }
        }

        // Text Insertions
        function insertText(text) {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const val = editor.value;
            editor.value = val.substring(0, start) + text + val.substring(end);
            editor.selectionStart = editor.selectionEnd = start + text.length;
            editor.focus();
            updateEditor();
        }
        function insertColor(input) { insertText(input.value); showNotification(`Color ${input.value} inserted`, "info"); }
        
        const snippets = {
            html: `<!DOCTYPE html>\n<html>\n<head>\n</head>\n<body>\n  <h1>Hello</h1>\n</body>\n</html>`,
            css: `* { margin:0; box-sizing:border-box; }`,
            nav: `<nav style="background:#333; color:white; padding:15px; display:flex; justify-content:space-between;">\n  <b>Logo</b>\n  <div>Home</div>\n</nav>`,
            card: `<div style="border:1px solid #ddd; padding:20px; border-radius:8px; background:white;">\n  <h3>Card UI</h3>\n</div>`,
            btn: `<button style="background:#007acc; color:white; padding:10px; border:none; border-radius:5px;">Click</button>`,
            js: `console.log('Script loaded');`
        };
        function insertSnippet(k) { insertText(snippets[k]); closeAllModals(); showNotification("Template snippet inserted", "success"); }

        // File I/O
        function saveFile() {
            const blob = new Blob([editor.value], { type: currentFile.endsWith('.js') ? 'text/javascript' : (currentFile.endsWith('.css') ? 'text/css' : 'text/html') });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = currentFile;
            a.click();
            showNotification(`Downloaded ${currentFile} successfully`, "success");
        }
        function loadFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) { 
                editor.value = e.target.result; 
                vfs[currentFile] = editor.value; 
                saveVFS();
                updateEditor(); 
                showNotification(`Loaded content into ${currentFile}`, "success");
            };
            reader.readAsText(file);
        }

        // Keyboard Shortcuts
        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                e.preventDefault();
                saveFile();
            }
        });
    </script>
</body>
</html>
